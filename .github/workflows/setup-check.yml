# Runs the student setup (uv sync + check_setup.py) on fresh Windows, macOS and Linux machines.
name: setup-check

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen   # CI machines have no screen; this still loads and runs the Qt browser
    steps:
      - uses: actions/checkout@v4

      - name: Install uv (same installer as the students)
        uses: astral-sh/setup-uv@v6

      - name: uv sync
        run: uv sync --locked

      - name: Download one Sleep-EDF night
        shell: bash
        run: |
          base=https://physionet.org/files/sleep-edfx/1.0.0/sleep-cassette
          curl -sSfL --retry 3 -o data/SC4001E0-PSG.edf       $base/SC4001E0-PSG.edf
          curl -sSfL --retry 3 -o data/SC4001EC-Hypnogram.edf $base/SC4001EC-Hypnogram.edf

      - name: Smoke test
        run: uv run python check_setup.py --auto-close

  # Linux: Qt draws through X11 (xcb), which needs a few system libraries.
  # Run on a virtual X display first WITHOUT installing them (to see what a fresh
  # machine is missing), then with the libraries the README tells students to install.
  linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Download one Sleep-EDF night
        run: |
          base=https://physionet.org/files/sleep-edfx/1.0.0/sleep-cassette
          curl -sSfL --retry 3 -o data/SC4001E0-PSG.edf       $base/SC4001E0-PSG.edf
          curl -sSfL --retry 3 -o data/SC4001EC-Hypnogram.edf $base/SC4001EC-Hypnogram.edf
      - name: Virtual display only
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
      - name: Smoke test before installing Qt system libraries (diagnostic)
        continue-on-error: true
        env:
          QT_DEBUG_PLUGINS: "0"
        run: xvfb-run -a uv run python check_setup.py --auto-close
      - name: Missing libraries for Qt's X11 plugin (diagnostic)
        run: |
          plug=$(find .venv -path "*platforms/libqxcb.so" | head -1)
          qpa=$(find .venv -name "libQt6XcbQpa.so*" | head -1)
          ldd "$plug" "$qpa" | grep "not found" | sort -u || echo "none missing"
      - name: Install Qt system libraries (as in the README)
        run: |
          sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 > /dev/null
      - name: Still missing after install (diagnostic)
        run: |
          plug=$(find .venv -path "*platforms/libqxcb.so" | head -1)
          qpa=$(find .venv -name "libQt6XcbQpa.so*" | head -1)
          ldd "$plug" "$qpa" | grep "not found" | sort -u || echo "none missing"
      - name: Smoke test (X11 display)
        run: xvfb-run -a uv run python check_setup.py --auto-close
